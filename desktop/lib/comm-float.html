<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Regis chat</title>
<style>
  html,body{margin:0;height:100%;background:#0b0710;color:#f1e9ff;font:600 12px "DM Sans","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
  .h{position:fixed;left:0;right:0;top:0;height:34px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;box-sizing:border-box;-webkit-app-region:drag;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-bottom:1px solid rgba(255,255,255,.1)}
  .ic{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font:700 10px sans-serif;color:#fff;flex:none;overflow:hidden}
  .ic img{width:100%;height:100%;object-fit:cover}
  b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  em{font-style:normal;background:#ff4f6d;color:#fff;border-radius:8px;padding:0 5px;font:700 10px/16px sans-serif;min-width:16px;text-align:center}
  em:empty{display:none}
  button{-webkit-app-region:no-drag;width:26px;height:24px;border:0;border-radius:6px;background:transparent;color:#cdbfe6;cursor:pointer;font:600 14px/1 sans-serif;display:grid;place-items:center}
  button:hover{background:rgba(255,255,255,.12);color:#fff}
  .msg{position:fixed;inset:34px 0 0 0;display:grid;place-items:center;color:#8f80aa;font-weight:500}
  body.min .msg{display:none}
</style></head>
<body>
  <div class="h"><span class="ic" id="ic"></span><b id="nm">Chat</b><em id="un"></em>
    <button id="min" title="Minimise">&#8211;</button><button id="full" title="Open in Comm">&#8599;</button><button id="x" title="Close the chat window">&#215;</button></div>
  <div class="msg" id="msg">Loading…</div>
<script>
  var A = window.regisFloat;
  document.getElementById('min').onclick = function () { A.act(document.body.classList.contains('min') ? 'restore' : 'min'); };
  document.getElementById('full').onclick = function () { A.act('open'); };
  document.getElementById('x').onclick = function () { A.act('close'); };
  document.querySelector('.h').ondblclick = function (e) { if (e.target.tagName !== 'BUTTON') A.act(document.body.classList.contains('min') ? 'restore' : 'min'); };
  A.onState(function (s) {
    document.getElementById('nm').textContent = s.name || 'Chat';
    var u = s.unread; document.getElementById('un').textContent = u > 0 ? (u > 99 ? '99+' : String(u)) : u < 0 ? '•' : '';
    var ic = document.getElementById('ic'); ic.style.background = s.color || '#6b4fd8'; ic.textContent = ''; if (s.icon && /^data:image\//.test(s.icon)) { var im = document.createElement('img'); im.src = s.icon; ic.appendChild(im); } else ic.textContent = (s.name || '?').charAt(0).toUpperCase();
    document.body.classList.toggle('min', !!s.min); document.getElementById('min').textContent = s.min ? '□' : '–'; document.getElementById('min').title = s.min ? 'Restore' : 'Minimise';
  });
</script>
</body></html>
