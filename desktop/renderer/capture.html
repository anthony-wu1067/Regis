<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Quick capture</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px 22px;background:linear-gradient(135deg,#171326,#0e0b18);color:#f1ecff;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;border:1px solid rgba(185,154,255,.35);border-radius:18px;overflow:hidden}
label{font:600 11px system-ui;letter-spacing:.14em;text-transform:uppercase;color:#b99aff}
input{width:100%;font:inherit;font-size:18px;color:inherit;background:rgba(255,255,255,.06);border:1px solid rgba(185,154,255,.35);border-radius:999px;padding:12px 18px;outline:none}
input:focus{border-color:#b99aff;box-shadow:0 0 0 3px rgba(185,154,255,.2)}
small{color:#a99fc8;font-size:12px}
</style></head><body>
<label for="t">Quick capture</label>
<input id="t" maxlength="200" autocomplete="off" placeholder="What do you need to do?  e.g. email Sam tomorrow !high" autofocus>
<small>Enter adds it to Regis. Esc closes. Understands tomorrow, mon, 11/5, every week, !high, #group.</small>
<script>
var t=document.getElementById('t');
t.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();var v=t.value.trim();if(v)window.captureBridge.submit(v);else window.captureBridge.close()}
  else if(e.key==='Escape'){window.captureBridge.close()}});
</script></body></html>
